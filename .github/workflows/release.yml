name: Build Windows Candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build-windows-candidate:
    name: Signed Windows candidate (no publication)
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 40
    environment: windows-signing
    env:
      WINDOWS_CERTIFICATE_SHA1: ${{ vars.WINDOWS_CERTIFICATE_SHA1 }}
      DISTRIBUTION_REPOSITORY: ${{ vars.DISTRIBUTION_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate committed corpus and pinned resources before preparation
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          npm run audit:corpus-governance:strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:embeddings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run preflight:release:strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare assets and rebuild native modules (no manifest regeneration)
        run: npm run prebuild:electron

      - name: Check that preparation preserved committed inputs
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run audit:corpus-governance:strict

      - name: Build Electron frontend and main process
        run: npm run build

      - name: Package signed installer without publication
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx --no-install electron-builder --config electron-builder.config.json --win --publish never -c.forceCodeSigning=true

      - name: Verify installer and application signatures against expected publisher
        run: ./scripts/verify-windows-signatures.ps1

      - name: Record tools, inputs, packaged resources and artifact hashes
        run: |
          $env:BUILD_NPM_VERSION = npm --version
          node scripts/release-artifacts.mjs create

      - name: Preserve candidate for acceptance
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/candidate/
          if-no-files-found: error
          retention-days: 30


name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, Node vault and legal gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare SQLite for Node (required, no skipped vault tests)
        run: npm rebuild better-sqlite3

      - name: Validate committed resources, tests, build and legal gates
        run: npm run ci:quality

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ci/quality/
          if-no-files-found: error
          retention-days: 30

  electron-vault:
    name: Node and Electron vault, recovery and UI (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare SQLite for Node
        run: npm rebuild better-sqlite3

      - name: Test Node before rebuilding for Electron
        run: npm run ci:windows

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ci/windows/
          if-no-files-found: error
          retention-days: 30

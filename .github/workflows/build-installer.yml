name: Build Installer

# Genera el instalador NSIS de Windows (sin firma mientras no exista certificado) en cada push a main
# y lo conserva como artefacto. Con ejecución manual puede publicarse además como pre-release en GitHub.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publicar el instalador como pre-release de GitHub (tag v<versión> en este commit)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Instalador Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache de Electron y electron-builder
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias
        run: npm ci

      - name: Validar corpus, embeddings y preflight (no estricto)
        shell: pwsh
        run: |
          npm run audit:corpus-governance:strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:embeddings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run preflight:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Construir y empaquetar (prebuild: icono, embeddings fijados, módulos nativos)"
        run: npm run build:electron

      - name: Comprobar que la preparación no alteró archivos versionados
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Manifiesto del instalador
        shell: pwsh
        run: |
          npm run pilot:manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Content release/pilot-manifest.json | ConvertFrom-Json | Select-Object version, sourceSha, signed, status | Format-List

      - name: Conservar instalador y manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: Lex-Corporativo-Setup-${{ env.APP_VERSION }}-${{ github.sha }}
          path: |
            release/Lex-Corporativo-Setup-*.exe
            release/Lex-Corporativo-Setup-*.exe.blockmap
            release/latest.yml
            release/pilot-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publicar pre-release en GitHub (sólo ejecución manual con publish_prerelease)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:APP_VERSION"
          $manifest = Get-Content release/pilot-manifest.json | ConvertFrom-Json
          $signed = if ($manifest.signed) { 'firmado' } else { 'sin firma (SmartScreen mostrará advertencia)' }
          $notes = @(
            "Instalador NSIS de Windows x64 para pruebas internas, $signed.",
            "",
            "- Commit: $env:GITHUB_SHA",
            "- SHA-256: $($manifest.installer.sha256)",
            "- Tamaño: $($manifest.installer.bytes) bytes",
            "",
            "Verifica el hash antes de instalar: Get-FileHash .\$($manifest.installer.path) -Algorithm SHA256"
          ) -join "`n"
          gh release create $tag `
            --target $env:GITHUB_SHA `
            --title "Lex Corporativo $env:APP_VERSION" `
            --notes $notes `
            --prerelease `
            release/Lex-Corporativo-Setup-*.exe release/Lex-Corporativo-Setup-*.exe.blockmap release/latest.yml release/pilot-manifest.json

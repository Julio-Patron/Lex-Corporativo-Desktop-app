name: Publish Accepted Windows Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful run ID of Build Windows Candidate
        required: true
        type: string
      accepted_source_sha:
        description: Full source SHA accepted after Windows testing
        required: true
        type: string
      accepted_manifest_sha256:
        description: SHA256 of the accepted candidate-manifest.json
        required: true
        type: string
      tag:
        description: Existing version tag pointing to the accepted SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-windows
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: windows-publication
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      ACCEPTED_SOURCE_SHA: ${{ inputs.accepted_source_sha }}
      ACCEPTED_MANIFEST_SHA256: ${{ inputs.accepted_manifest_sha256 }}
      RELEASE_TAG: ${{ inputs.tag }}
      DISTRIBUTION_REPOSITORY: ${{ vars.DISTRIBUTION_REPOSITORY }}
      WINDOWS_CERTIFICATE_SHA1: ${{ vars.WINDOWS_CERTIFICATE_SHA1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require successful candidate workflow, accepted SHA and existing version tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_RUN_ID -notmatch '^\d+$' -or $env:ACCEPTED_SOURCE_SHA -notmatch '^[a-f0-9]{40}$' -or $env:ACCEPTED_MANIFEST_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Identificadores inválidos.' }
          if ($env:DISTRIBUTION_REPOSITORY -ne $env:GITHUB_REPOSITORY) { throw 'Destino de publicación no confirmado.' }
          $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo consultar el candidato.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/release.yml' -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:ACCEPTED_SOURCE_SHA -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'El candidato no acredita los gates del SHA aceptado.' }
          $tagSha = git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:ACCEPTED_SOURCE_SHA) { throw 'El tag no corresponde al candidato aceptado.' }
          git merge-base --is-ancestor $env:ACCEPTED_SOURCE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'El candidato no está integrado en main.' }
          $artifactName = "windows-candidate-$env:ACCEPTED_SOURCE_SHA-$env:CANDIDATE_RUN_ID-$($run.run_attempt)"
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $artifactName --dir accepted-candidate
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar el candidato.' }

      - name: Verify accepted hashes without rebuilding
        run: node scripts/release-artifacts.mjs verify accepted-candidate

      - name: Revalidate installer Authenticode
        run: ./scripts/verify-windows-signatures.ps1 -ReleaseDirectory accepted-candidate -InstallerOnly

      - name: Publish the exact accepted files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Get-Content -Raw -LiteralPath 'accepted-candidate/candidate-manifest.json' | ConvertFrom-Json
          $files = @($candidate.artifacts | ForEach-Object { Join-Path 'accepted-candidate' $_.path })
          $files += 'accepted-candidate/candidate-manifest.json'
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', $env:RELEASE_TAG, '--generate-notes')
          if ($candidate.version.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs @files
          if ($LASTEXITCODE -ne 0) { throw 'La publicación falló; no se sobrescriben releases existentes.' }

      - name: Check downloaded release hashes
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir published-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-artifacts.mjs verify published-check
